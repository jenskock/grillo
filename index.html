<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gartenplanung Pestalozzistraße 28, Münster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">Pestalozzistraße 28</span>
        <h1>Grillecke 3D</h1>
      </div>
      <div class="topbar-actions">
        <div class="controls">
          <button type="button" id="focus-grill">Grillecke</button>
          <button type="button" id="focus-dining">Essplatz</button>
          <button type="button" id="reset-3d">Übersicht</button>
          <button type="button" id="toggle-lamellas">Lamellen öffnen</button>
        </div>
      </div>
    </header>

    <div class="stage">
      <div class="view-3d" id="view-3d-container"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
